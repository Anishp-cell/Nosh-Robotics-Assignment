preprocessing:
  blur_method: gaussian
  blur_ksize:
  - 7
  - 7
  blur_sigma: 1.5
color_analysis:
  color_space: gray
  clahe:
    enabled: false
thresholding:
  method: otsu
  invert: false
morphology:
  open_kernel_size:
  - 7
  - 7
  open_iterations: 1
  close_kernel_size:
  - 9
  - 9
  close_iterations: 1
  fill_holes: true
component_filtering:
  enabled: true
  min_area: 300
  max_area: 405000
  min_circularity: 0.0
  min_aspect_ratio: 0.0
  max_aspect_ratio: 100.0
watershed:
  enabled: false
outputs:
  masks_dir: outputs/classical/masks
  overlays_dir: outputs/classical/overlays
  experiments_dir: outputs/classical/experiments
